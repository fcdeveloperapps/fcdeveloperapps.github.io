<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fcdeveloperapps</title>
<meta name="description" content="Le app di fcdeveloperapps.">
<style>
  :root { --blu: #0f3d5e; --oro: #f3d98b; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f1f5f9; color: #1f2937; }
  header { background: var(--blu); color: #fff; padding: 28px 16px; text-align: center; }
  header h1 { margin: 0; font-size: 24px; }
  header p { margin: 6px 0 0; color: var(--oro); }
  main { max-width: 560px; margin: 0 auto; padding: 16px; }
  a.app { display: flex; gap: 14px; align-items: center; background: #fff; border-radius: 16px; padding: 14px; text-decoration: none; color: inherit; box-shadow: 0 1px 3px rgba(0,0,0,.12); margin-bottom: 12px; }
  a.app img { width: 60px; height: 60px; border-radius: 14px; }
  a.app h2 { margin: 0; font-size: 18px; color: var(--blu); }
  a.app p { margin: 3px 0 0; font-size: 14px; color: #64748b; }
</style>
</head>
<body>
<header>
  <h1>fcdeveloperapps</h1>
  <p>Le nostre app</p>
</header>
<main>
  <a class="app" href="https://play.google.com/store/apps/details?id=com.monumenti.venezia">
    <img src="venezia/icona.png" alt="">
    <div>
      <h2>Venezia: Monumenti &amp; altro</h2>
      <p>Mappa dei monumenti, itinerari, orari, maree e vaporetti · Google Play</p>
    </div>
  </a>
</main>
</body>
</html>
